[project]
name = "heatctl-run-h2"
version = "0.0.0"
description = "H2: the model comparison, on H1's loop."
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai-harness[coder,anthropic]",
    "pydantic-ai-slim[openai]",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
